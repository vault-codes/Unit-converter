<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title> Unit Converter, pieced by Prime Web Craft </title>
<link href="./style.css" rel="stylesheet" />
</head>
<body>

    <div class="head-container">

        <h1> Metric/Imperial Unit Conversion</h1>

        <input type="text" id="unit" placeholder=" Type in number to convert" >

        <button id="convertBtn"> Convert </button>


    </div>

    <div class="body-container">
        <div class="box" id="box1">
<h3 class="unit1Title"> Length (Meter/Feet)</h3><p id="unit1-value"></p>
        </div>
<div class="box">
<h3 class="unit2Title" id="box2"> Volume(Liters/Gallons) </h3><p id="unit2-value"></p>
        </div>
        <div class="box" id="box3"> 
<h3 class="unit3Title"> Mass(Kilograms/Pounds) </h3><p id="unit3-value"></p>
        </div>
        
        


    </div>
    <footer>
        <p>Pieced by <a href="https://github.com/vault-codes/">Prime-web-craft </a>  </p>
    </footer>



    <script src="./index.js"></script>
</body>
  </html>
